<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">

<title>Kontoverteiler – Finanzielle Ordnung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: App-Shell mit fester Kopfzeile, eine Spalte am Handy, Kontokarten im Raster ab Tablet, Tab-Leiste unten */
:root{
  --bg:#f5f6f0;--surface:#ffffff;--ink:#1a2d24;--muted:#5f7268;--line:#e2e7dc;--soft:#eef2e7;
  --brand:#164e38;--brand-ink:#ffffff;--brand-soft:#cfe6d8;--accent:#0c8458;
  --ok:#0c7a51;--ok-bg:#e3f4ea;--warn:#a76a12;--bad:#b13a2c;--bad-bg:#fbe9e6;
  --k1:#2f7d5b;--k2:#b8862b;--k3:#4b6fa8;--k4:#8a5a9f;--k5:#c25a48;--k6:#4e8c88;--k0:#9aa89f;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1612;--surface:#17211b;--ink:#e5eee8;--muted:#98aa9f;--line:#28362e;--soft:#1d2a22;
  --brand:#1b5b42;--brand-ink:#ffffff;--brand-soft:#a9d9be;--accent:#3cc08a;
  --ok:#4fc792;--ok-bg:#163527;--warn:#e2ab4f;--bad:#ef7e6e;--bad-bg:#3a1f1b;
  --k1:#5bbf8f;--k2:#e0b056;--k3:#7fa2dc;--k4:#bb8ad0;--k5:#ec8b78;--k6:#7cc3be;--k0:#6c7c72;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1612;--surface:#17211b;--ink:#e5eee8;--muted:#98aa9f;--line:#28362e;--soft:#1d2a22;
  --brand:#1b5b42;--brand-ink:#ffffff;--brand-soft:#a9d9be;--accent:#3cc08a;
  --ok:#4fc792;--ok-bg:#163527;--warn:#e2ab4f;--bad:#ef7e6e;--bad-bg:#3a1f1b;
  --k1:#5bbf8f;--k2:#e0b056;--k3:#7fa2dc;--k4:#bb8ad0;--k5:#ec8b78;--k6:#7cc3be;--k0:#6c7c72;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.amt{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
/* Kopf */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{font-weight:800;letter-spacing:.06em;font-size:13px}
.logo b{color:var(--accent)}
.sub{font-size:12px;color:var(--muted);margin-top:1px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--soft);color:var(--warn);border:1px solid var(--line);padding:5px 9px;border-radius:999px}
main{padding-block:18px 120px}
/* Tabs unten */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-block:6px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--soft)}
/* Allgemein */
h2.sec{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
h2.sec span{font-weight:600;letter-spacing:0;text-transform:none;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--accent);color:#fff;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.small{padding:8px 12px;font-size:13px}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:16px}
.notice.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.notice p{margin:0;min-width:0;flex:1 1 220px}
/* Hero */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:22px 20px 18px}
.hero-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--brand-soft)}
.big{font-size:clamp(34px,8vw,48px);font-weight:800;letter-spacing:-.035em;line-height:1.1}
.mid{font-size:clamp(22px,5vw,28px);font-weight:800;letter-spacing:-.02em;text-align:right}
.hero-top .right .lbl{text-align:right}
.flow{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:18px 0 12px;background:rgba(255,255,255,.14);gap:2px}
.flow span{display:block;height:100%;min-width:3px}
.legend{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--brand-soft)}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend b{color:var(--brand-ink);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;min-width:0}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi strong{display:block;font-size:19px;font-weight:800;margin-top:3px;overflow-wrap:anywhere}
/* Kontokarten */
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.acc header{display:flex;align-items:center;gap:9px}
.acc h3{margin:0;font-size:16px;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.dot{width:11px;height:11px;border-radius:4px;background:var(--c);flex:none}
.pill{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--soft);color:var(--muted)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nums small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.nums strong{font-size:20px;font-weight:800;letter-spacing:-.02em}
.nums .need strong{color:var(--muted)}
.meter{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter span{display:block;height:100%;background:var(--c);border-radius:999px}
.meter.bad span{background:var(--bad)}
.acc details{border-top:1px solid var(--line);padding-top:10px}
.acc summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.acc details[open] summary::before{transform:rotate(90deg)}
.mini{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.mini li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.mini li:last-child{border:0}
.mini em{font-style:normal;color:var(--muted);font-size:12px}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint b{color:var(--ink)}
/* Hauptkonto */
.lines .line{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.lines .line:last-child{border:0;font-weight:800;font-size:17px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
/* Formulare & Listen */
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.field{grid-column:span 2;min-width:0}
.field.w3{grid-column:span 3}
.field.w6{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;min-width:0}
.actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px;scroll-margin-top:calc(72px + env(safe-area-inset-top,0px))}
.chip .cc{font-weight:600;opacity:.65;font-variant-numeric:tabular-nums}
.listsum{margin:8px 0 0;font-size:13px;color:var(--muted)}
.listsum b{color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{margin-top:18px}
.group h3{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 4px}
.group h3 .amt{margin-left:auto;color:var(--muted);font-weight:700}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row strong{display:block;font-size:14.5px;overflow-wrap:anywhere}
.row small{display:block;font-size:12.5px;color:var(--muted)}
.row .r{text-align:right}
.cat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--soft);padding:2px 7px;border-radius:6px;margin-right:6px}
.icons{display:flex;gap:4px}
.ib{border:0;background:var(--soft);border-radius:9px;min-width:34px;height:34px;padding:0 9px;color:var(--muted);font-weight:700;font-size:13px}
.ib.armed{background:var(--bad);color:#fff}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;z-index:9;max-width:calc(100% - 32px)}
.foot{font-size:12px;color:var(--muted);margin-top:28px;line-height:1.6}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr 1fr}.kpis .kpi:last-child{grid-column:1/-1}
  .form{grid-template-columns:1fr 1fr}.field,.field.w3{grid-column:span 1}.field.w6,.field.first{grid-column:1/-1}
  .mid,.hero-top .right .lbl{text-align:left}
}
@media (min-width:900px){.tabs{top:auto}}
/* Freischalten & Installieren */
dialog{border:0;border-radius:18px;padding:0;max-width:min(440px,calc(100% - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,15,.55)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:20px}
.dlg p{margin:0;color:var(--muted);font-size:14px}
.dlg input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:13px 12px;font-size:18px;letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.dlg .err{color:var(--bad);font-size:13px;font-weight:700;margin:0}
.dlg .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlg a{color:var(--accent);font-weight:700;font-size:14px}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:8;max-width:520px;margin:0 auto;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:16px 16px 14px;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.sheet strong{font-size:16px}
.sheet p{margin:0;font-size:13.5px;color:var(--brand-soft)}
.sheet ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.sheet ol svg{width:18px;height:18px;vertical-align:-3px}
.sheet .row2{display:flex;gap:8px;flex-wrap:wrap}
.sheet .btn{background:#fff;color:var(--brand)}
.sheet .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="bar"><div class="wrap">
  <div><div class="logo">FINANZIELLE <b>ORDNUNG</b></div><div class="sub">Mein Kontoverteiler</div></div>

<script>
(()=>{'use strict';
const KEY='fo_kontoverteiler_v1';
const PER={monthly:['monatlich',1],quarterly:['vierteljährlich',3],halfyear:['halbjährlich',6],yearly:['jährlich',12],weekly:['wöchentlich',12/52]};
const CAT={creditors:'Fixkosten',insurance:'Versicherungen',rates:'Raten'};
const CAT1={creditors:'Fixkosten',insurance:'Versicherung',rates:'Rate'};
/* Eigene Kategorienamen (in den Daten gespeichert, Standard bleibt für alle anderen) */
const catName=k=>(S&&S.catNames&&typeof S.catNames[k]==='string'&&S.catNames[k])||CAT[k];
const catShort=k=>(S&&S.catNames&&typeof S.catNames[k]==='string'&&S.catNames[k])||CAT1[k];
const fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const eur=n=>{const v=Math.round(n*100)/100;return fmt.format(v===0?0:v)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mon=e=>e.amount/PER[e.period][1];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const $=s=>document.querySelector(s);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);

function demo(){
  const A=[['a1','Auto',350],['a2','Versicherungen',250],['a3','Gläubigerkonto',1900],['a4','Rücklagen',150],['a5','Urlaub',100]].map(([id,name,transfer])=>({id,name,transfer}));
  const E=[
    ['Tanken','creditors',250,'monthly','a1'],['TÜV & Werkstatt','creditors',600,'yearly','a1'],
    ['Kfz-Versicherung','insurance',64.5,'monthly','a2'],['Privathaftpflicht','insurance',78,'yearly','a2'],['Hausrat','insurance',114,'yearly','a2'],['Rechtsschutz','insurance',26.42,'monthly','a2'],['Berufsunfähigkeit','insurance',87,'monthly','a2'],
    ['Miete','creditors',1050,'monthly','a3'],['Strom','creditors',98,'monthly','a3'],['Gas','creditors',85,'monthly','a3'],['Internet','creditors',39.99,'monthly','a3'],['Handy','creditors',24.99,'monthly','a3'],['Rundfunkbeitrag','creditors',55.08,'quarterly','a3'],['Autokredit','rates',389,'monthly','a3'],['Ratenkauf Möbel','rates',108.22,'monthly','a3'],
    ['Fitnessstudio','creditors',29.9,'monthly','']
  ].map(([name,cat,amount,period,acc])=>({id:uid(),name,cat,amount,period,acc}));
  return{v:1,demo:true,income:[{id:uid(),name:'Gehalt',amount:3400,period:'monthly'}],accounts:A,entries:E};
}
function validE(e){return e&&typeof e.id==='string'&&typeof e.name==='string'&&e.name.length<=160&&Number.isFinite(e.amount)&&e.amount>=0&&e.amount<=1e9&&Object.hasOwn(PER,e.period)}
function validState(s){return s&&Array.isArray(s.income)&&Array.isArray(s.accounts)&&Array.isArray(s.entries)&&s.income.every(validE)&&s.entries.every(e=>validE(e)&&Object.hasOwn(CAT,e.cat)&&typeof e.acc==='string')&&s.accounts.every(a=>a&&typeof a.id==='string'&&typeof a.name==='string'&&Number.isFinite(a.transfer)&&a.transfer>=0)}
let S;
/* Umlaute reparieren, falls Text unterwegs falsch kodiert wurde (z. B. „GlÃ¤ubiger“ → „Gläubiger“) */
function fixText(s){if(typeof s!=='string'||!/[ÃÂâ]/.test(s))return s;try{const t=decodeURIComponent(escape(s));return t}catch{return s}}
function fixState(s){if(!s)return s;(s.income||[]).forEach(x=>x.name=fixText(x.name));(s.accounts||[]).forEach(x=>x.name=fixText(x.name));(s.entries||[]).forEach(x=>x.name=fixText(x.name));if(s.catNames&&typeof s.catNames==='object')for(const k in s.catNames)s.catNames[k]=fixText(s.catNames[k]);return s}
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');S=validState(r)?fixState(r):demo()}catch{S=demo()}
let tab='verteiler';try{tab=localStorage.getItem(KEY+'_tab')||'verteiler'}catch{}
if(!['verteiler','zahlungen','konten'].includes(tab))tab='verteiler';
let edit=null,armed=null,armTimer=null,filter='all',toastTimer=null;
/* Formular merkt sich Kategorie, Konto und Rhythmus für die nächste Zahlung */
const FKEY=KEY+'_form';
let form={cat:'creditors',per:'monthly',catAcc:{}};
try{const r=JSON.parse(localStorage.getItem(FKEY)||'null');if(r&&typeof r==='object'){if(Object.hasOwn(CAT,r.cat))form.cat=r.cat;if(Object.hasOwn(PER,r.per))form.per=r.per;if(r.catAcc&&typeof r.catAcc==='object')form.catAcc=r.catAcc}}catch{}
function saveForm(){try{localStorage.setItem(FKEY,JSON.stringify(form))}catch{}}
function accExists(id){return id===''||S.accounts.some(a=>a.id===id)}
function accForCat(cat){

function stats(){
  const inc=sum(S.income,mon);
  const acc=S.accounts.map((a,i)=>{const items=S.entries.filter(e=>e.acc===a.id);const need=sum(items,mon);return{...a,i,items,need,diff:a.transfer-need}});
  const ids=new Set(S.accounts.map(a=>a.id));
  const mainItems=S.entries.filter(e=>!ids.has(e.acc));
  const mainNeed=sum(mainItems,mon),transfers=sum(S.accounts,a=>a.transfer),rest=inc-transfers;
  return{inc,acc,mainItems,mainNeed,transfers,rest,life:rest-mainNeed,buffer:sum(acc.filter(a=>a.items.length),a=>Math.max(0,a.diff))};
}
const col=i=>`var(--k${i%6+1})`;const accName=id=>(S.accounts.find(a=>a.id===id)||{name:'Hauptkonto'}).name;

/* ---------- Verteiler ---------- */
function vVerteiler(){
  const t=stats();
  if(!S.income.length&&!S.accounts.length)return`<section class="panel"><h2 style="margin:0 0 8px;font-size:20px">Lege deinen Verteiler an</h2><p class="muted" style="margin:0 0 14px">Trage dein Gehalt und deine Unterkonten mit dem festen Überweisungsbetrag ein. Danach ordnest du jede Zahlung einem Konto zu.</p><button class="btn" data-act="goto" data-to="konten">Konten einrichten</button></section>`;
  const under=t.acc.filter(a=>a.items.length&&a.diff<-0.004);
  const base=Math.max(t.inc,t.transfers,1);
  const segs=t.acc.filter(a=>a.transfer>0).map(a=>`<span style="width:${a.transfer/base*100}%;background:${col(a.i)}" title="${esc(a.name)}"></span>`).join('')+(t.rest>0?`<span style="width:${t.rest/base*100}%;background:var(--k0)" title="Hauptkonto"></span>`:'');
  const leg=t.acc.map(a=>`<li><i style="background:${col(a.i)}"></i>${esc(a.name)} <b class="num">${eur(a.transfer)}</b></li>`).join('')+`<li><i style="background:var(--k0)"></i>Hauptkonto <b class="num">${eur(t.rest)}</b></li>`;
  let h='';
  if(S.demo&&licensed)h+=`<div class="notice"><p>Das sind <b>Beispieldaten</b>, damit du siehst, wie der Verteiler arbeitet.</p><button class="btn small" data-act="fresh">Mit eigenen Daten starten</button></div>`;
  if(under.length)h+=`<div class="notice bad"><p>${under.map(a=>`<b>${esc(a.name)}</b> ist um ${eur(-a.diff)} unterdeckt. Erhöhe den Verteiler bei der Bank auf mindestens ${eur(Math.ceil(a.need))}.`).join('<br>')}</p></div>`;
  if(t.rest<0)h+=`<div class="notice bad"><p>Deine Verteiler-Überweisungen sind ${eur(-t.rest)} höher als dein Gehaltseingang.</p></div>`;
  h+=`<section class="hero"><div class="hero-top"><div><span class="lbl">Gehaltseingang pro Monat</span><div class="big num">${eur(t.inc)}</div></div><div class="right"><span class="lbl">Frei zum Leben</span><div class="mid num">${eur(t.life)}</div></div></div><div class="flow" role="img" aria-label="Aufteilung deines Gehalts auf die Konten">${segs}</div><ul class="legend">${leg}</ul></section>`;
  h+=`<div class="kpis"><div class="kpi"><small>Automatisch verteilt</small><strong class="num">${eur(t.transfers)}</strong></div><div class="kpi"><small>Bleibt auf dem Hauptkonto</small><strong class="num ${t.rest<0?'neg':''}">${eur(t.rest)}</strong></div><div class="kpi"><small>Puffer auf Unterkonten / Monat</small><strong class="num pos">${eur(t.buffer)}</strong></div></div>`;
  h+=`<h2 class="sec">Unterkonten <span>Überweisung im Vergleich zum tatsächlichen Bedarf</span></h2><div class="accs">`;
  h+=t.acc.map(a=>{
    const has=a.items.length,bad=has&&a.diff<-0.004;
    const pill=!has?`<span class="pill neutral">Rücklage</span>`:bad?`<span class="pill bad">${eur(a.diff)} fehlen</span>`:`<span class="pill ok">+${eur(a.diff)} Puffer</span>`;
    const w=a.transfer>0?Math.min(100,a.need/a.transfer*100):(has?100:0);
    const body=has?`<div class="meter ${bad?'bad':''}" role="img" aria-label="${Math.round(w)} % der Überweisung verplant"><span style="width:${w}%"></span></div><details><summary>${a.items.length} ${a.items.length===1?'Zahlung':'Zahlungen'} anzeigen</summary><ul class="mini">${a.items.slice().sort((x,y)=>mon(y)-mon(x)).map(e=>`<li><span>${esc(e.name)}${e.period!=='monthly'?` <em>(${eur(e.amount)} ${PER[e.period][0]})</em>`:''}</span><span class="num">${eur(mon(e))}</span></li>`).join('')}</ul></details>`:`<p class="hint">Keine Zahlungen zugeordnet. Der Betrag sammelt sich jeden Monat als Rücklage an.</p>`;
    return`<article class="acc" style="--c:${col(a.i)}"><header><span class="dot"></span><h3>${esc(a.name)}</h3>${pill}</header><div class="nums"><div><small>Überweisung</small><strong class="num">${eur(a.transfer)}</strong></div><div class="need"><small>Tatsächlicher Bedarf</small><strong class="num">${has?eur(a.need):'–'}</strong></div></div>${body}</article>`;
  }).join('');
  h+=`</div><h2 class="sec">Hauptkonto <span>was nach dem Verteiler übrig bleibt</span></h2><section class="panel lines">`+
    `<div class="line"><span>Gehaltseingang</span><span class="num">${eur(t.inc)}</span></div>`+
    `<div class="line"><span>Abzüglich Verteiler auf ${t.acc.length} Unterkonten</span><span class="num">−${eur(t.transfers)}</span></div>`+
    t.mainItems.map(e=>`<div class="line"><span>${esc(e.name)} <span class="muted" style="font-size:13px">vom Hauptkonto</span></span><span class="num">−${eur(mon(e))}</span></div>`).join('')+
    `<div class="line"><span>Frei zum Leben</span><span class="num ${t.life<0?'neg':'pos'}">${eur(t.life)}</span></div></section>`;
  h+=`<p class="foot">Nicht monatliche Zahlungen zählen mit ihrem Monatsanteil: 600 € jährlich ergeben 50 € pro Monat. Der Puffer bleibt auf dem jeweiligen Unterkonto und deckt diese Zahlungen, wenn sie fällig werden.</p>`;
  return h;
}

function vZahlungen(){
  const e=edit&&edit.kind==='entry'?S.entries.find(x=>x.id===edit.id):null;
  const dCat=e?e.cat:(filter!=='all'?filter:form.cat), dAcc=e?e.acc:accForCat(dCat), dPer=e?e.period:form.per;
  let h=`<section class="panel"><h2 style="margin:0 0 4px;font-size:19px">${e?'Zahlung bearbeiten':'Zahlung hinzufügen'}</h2><p class="muted" style="margin:0 0 14px;font-size:14px">${e?'Ändere die Angaben und speichere.':'Kategorie, Konto und Rhythmus bleiben für die nächste Zahlung eingestellt. So trägst du mehrere Zahlungen nacheinander ein.'}</p>
  <form class="form" id="fEntry"><div class="field w3 first"><label for="eName">Bezeichnung</label><input id="eName" maxlength="160" required placeholder="z. B. Hausrat" value="${e?esc(e.name):''}"></div>
  <div class="field w3"><label for="eAmt">Betrag in €</label><input id="eAmt" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0,00" value="${e?e.amount:''}"></div>
  <div class="field"><label for="ePer">Rhythmus</label><select id="ePer">${perOptions(dPer)}</select></div>
  <div class="field"><label for="eCat">Kategorie</label><select id="eCat">${Object.keys(CAT).map(k=>`<option value="${k}" ${dCat===k?'selected':''}>${esc(catName(k))}</option>`).join('')}</select></div>
  <div class="field"><label for="eAcc">Abbuchung von</label><select id="eAcc">${accOptions(dAcc)}</select></div>
  <div class="actions"><button class="btn" type="submit">${e?'Änderung speichern':'Hinzufügen'}</button>${e?'<button class="btn ghost" type="button" data-act="cancel">Abbrechen</button>':''}</div></form></section>`;
  const cnt=k=>k==='all'?S.entries.length:S.entries.filter(x=>x.cat===k).length;
  h+=`<div class="chips" id="chips" role="group" aria-label="Nach Kategorie filtern">${[['all','Alle'],...Object.keys(CAT).map(k=>[k,catName(k)])].map(([k,v])=>`<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${filter===k}">${esc(v)} <span class="cc">${cnt(k)}</span></button>`).join('')}</div>`;
  const list=S.entries.filter(x=>filter==='all'||x.cat===filter);
  if(list.length)h+=`<p class="listsum"><b>${list.length} ${list.length===1?'Zahlung':'Zahlungen'}</b>${filter!=='all'?' in „'+esc(catName(filter))+'“':''} · ${eur(sum(list,mon))} pro Monat</p>`;
  if(!list.length)return h+`<div class="empty" style="margin-top:14px">Noch keine Zahlungen${filter!=='all'?' in dieser Kategorie':''}.</div>`;
  const groups=[...S.accounts.map((a,i)=>({id:a.id,name:a.name,c:col(i)})),{id:'',name:'Hauptkonto',c:'var(--k0)'}];
  const ids=new Set(S.accounts.map(a=>a.id));
  for(const g of groups){
    const items=list.filter(x=>g.id===''?!ids.has(x.acc):x.acc===g.id).sort((a,b)=>a.name.localeCompare(b.name,'de'));
    if(!items.length)continue;
    h+=`<div class="group"><h3><span class="dot" style="--c:${g.c}"></span>${esc(g.name)}<span class="amt">${eur(sum(items,mon))} / Monat</span></h3>`+items.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><small><span class="cat">${esc(catShort(x.cat))}</span>${eur(x.amount)} ${PER[x.period][0]}</small></div><div class="r"><strong class="num">${eur(mon(x))}</strong><small>pro Monat</small></div>${rowBtns('entry',x.id)}</div>`).join('')+`</div>`;
  }
  return h;
}

/* ---------- Konten ---------- */
function vKonten(){
  const ei=edit&&edit.kind==='income'?S.income.find(x=>x.id===edit.id):null;
  const ea=edit&&edit.kind==='account'?S.accounts.find(x=>x.id===edit.id):null;
  let h=`<h2 class="sec" style="margin-top:4px">Einnahmen</h2><section class="panel">`+
    (S.income.length?S.income.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><small>${eur(x.amount)} ${PER[x.period][0]}</small></div><div class="r"><strong class="num">${eur(mon(x))}</strong><small>pro Monat</small></div>${rowBtns('income',x.id)}</div>`).join(''):'<div class="empty">Noch kein Gehalt eingetragen.</div>')+
    `<form class="form" id="fIncome" style="margin-top:14px"><div class="field first"><label for="iName">Bezeichnung</label><input id="iName" maxlength="160" required placeholder="z. B. Gehalt" value="${ei?esc(ei.name):''}"></div><div class="field"><label for="iAmt">Betrag in €</label><input id="iAmt" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0,00" value="${ei?ei.amount:''}"></div><div class="field"><label for="iPer">Rhythmus</label><select id="iPer">${perOptions(ei?ei.period:'monthly')}</select></div><div class="actions"><button class="btn" type="submit">${ei?'Änderung speichern':'Einnahme hinzufügen'}</button>${ei?'<button class="btn ghost" type="button" data-act="cancel">Abbrechen</button>':''}</div></form></section>`;
  h+=`<h2 class="sec">Unterkonten <span>fester Betrag, den die Bank bei Gehaltseingang überweist</span></h2><section class="panel">`+
    (S.accounts.length?S.accounts.map((a,i)=>{const n=S.entries.filter(e=>e.acc===a.id).length;return`<div class="row"><div><strong><span class="dot" style="--c:${col(i)};display:inline-block;margin-right:7px"></span>${esc(a.name)}</strong><small>${n} ${n===1?'Zahlung':'Zahlungen'} zugeordnet</small></div><div class="r"><strong class="num">${eur(a.transfer)}</strong><small>pro Monat</small></div>${rowBtns('account',a.id)}</div>`}).join(''):'<div class="empty">Noch keine Unterkonten. Lege z. B. „Versicherungen“ oder „Gläubigerkonto“ an.</div>')+
    `<form class="form" id="fAcc" style="margin-top:14px"><div class="field w3 first"><label for="aName">Kontoname</label><input id="aName" maxlength="60" required placeholder="z. B. Versicherungen" value="${ea?esc(ea.name):''}"></div><div class="field w3"><label for="aAmt">Überweisung pro Monat in €</label><input id="aAmt" type="number" inputmode="decimal" min="0" step="0.01" required placeholder="0,00" value="${ea?ea.transfer:''}"></div><div class="actions"><button class="btn" type="submit">${ea?'Änderung speichern':'Unterkonto hinzufügen'}</button>${ea?'<button class="btn ghost" type="button" data-act="cancel">Abbrechen</button>':''}</div></form>
    <p class="hint" style="margin-top:12px">Löschst du ein Unterkonto, wandern seine Zahlungen aufs Hauptkonto.</p></section>`;
  h+=`<h2 class="sec">Kategorien <span>nenne sie so, wie du sie im Alltag nennst</span></h2><section class="panel"><form class="form" id="fCats">${Object.keys(CAT).map(k=>`<div class="field"><label for="cn_${k}">Statt „${CAT[k]}“</label><input id="cn_${k}" maxlength="40" placeholder="${CAT[k]}" value="${esc(S.catNames&&S.catNames[k]||'')}"></div>`).join('')}<div class="actions"><button class="btn" type="submit">Namen speichern</button></div></form><p class="hint" style="margin-top:12px">Leeres Feld = Standardname. Deine Zahlungen bleiben dabei unverändert.</p></section>`;
  h+=`<h2 class="sec">Sicherung</h2><section class="panel"><p class="hint" style="margin-bottom:12px">Deine Daten bleiben nur auf diesem Gerät. Kopiere die Sicherung und bewahre sie z. B. in einer Notiz auf. Zum Wiederherstellen fügst du sie unten ein.</p>
    <div class="actions" style="margin-bottom:12px"><button class="btn ghost" data-act="copy">Sicherung kopieren</button></div>
    <form id="fImport"><label class="muted" for="impText" style="display:block;font-size:12px;font-weight:700;margin-bottom:5px">Sicherung einfügen</label><textarea id="impText" placeholder='{"v":1, …}'></textarea><div class="actions" style="margin-top:8px"><button class="btn ghost" type="submit">Sicherung einlesen</button><button class="btn danger ${armed==='__reset'?'':''}" type="button" data-act="reset">${armed==='__reset'?'Wirklich alles löschen?':'Alle Daten löschen'}</button></div></form></section>
    <p class="foot"><b>© 2026 Finanzielle Ordnung · Kai Kremer.</b> Werkzeug zur eigenständigen Organisation deiner Einnahmen und Ausgaben. Keine Bankanbindung und keine Anlage-, Kredit-, Rechts- oder Steuerberatung. <a href="https://finanzielle-ordnung.de/impressum.html" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">Impressum</a></p>`;
  return h;
}

function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  $('#demoTag').hidden=!S.demo;
  $('#view').innerHTML=lockNote()+(tab==='verteiler'?vVerteiler():tab==='zahlungen'?vZahlungen():vKonten());
}
function setTab(t){tab=t;edit=null;armed=null;try{localStorage.setItem(KEY+'_tab',t)}catch{}render();scrollTo({top:0})}
function arm(id){armed=id;clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;render()},3500);render()}
function owned(){if(S.demo){S.demo=false}}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id,kind=b.dataset.kind;
  if(act==='unlock')return openUnlock();
  if(act==='closeUnlock')return closeUnlock();
  if(!licensed&&['edit','del','fresh','reset'].includes(act))return openUnlock();
  if(act==='goto')setTab(b.dataset.to);
  else if(act==='filter'){filter=b.dataset.f;render();const c=$('#chips');if(c)c.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
  else if(act==='cancel'){edit=null;render()}
  else if(act==='edit'){edit={kind,id};render();const f=document.querySelector(kind==='entry'?'#eName':kind==='income'?'#iName':'#aName');if(f){f.focus();f.scrollIntoView({block:'center'})}}
  else if(act==='del'){
    if(armed!==id)return arm(id);
    armed=null;owned();
    if(kind==='entry')S.entries=S.entries.filter(x=>x.id!==id);
    if(kind==='income')S.income=S.income.filter(x=>x.id!==id);
    if(kind==='account'){S.accounts=S.accounts.filter(x=>x.id!==id);S.entries.forEach(e=>{if(e.acc===id)e.acc=''})}
    if(edit&&edit.id===id)edit=null;changed();toast('Gelöscht')}
  else if(act==='fresh'){S={v:1,demo:false,income:[],accounts:[],entries:[]};edit=null;changed();setTab('konten');toast('Leerer Start. Trage zuerst dein Gehalt ein.')}
  else if(act==='reset'){if(armed!=='__reset')return arm('__reset');armed=null;S={v:1,demo:false,income:[],accounts:[],entries:[]};edit=null;changed();toast('Alle Daten gelöscht')}
  else if(act==='copy'){const txt=JSON.stringify(S);const fb=()=>{const t=$('#impText');t.value=txt;t.focus();t.select();toast('Sicherung markiert. Jetzt kopieren.')};try{navigator.clipboard.writeText(txt).then(()=>toast('Sicherung kopiert'),fb)}catch{fb()}}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='eCat'&&!(edit&&edit.kind==='entry')){const a=$('#eAcc');if(a)a.value=accForCat(ev.target.value)}
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target;const n=v=>Number(String(v).replace(',','.'));
  if(f.id==='fUnlock'){const c=$('#code').value;checkCode(c).then(ok=>{if(ok){licensed=true;try{localStorage.setItem(LKEY,normCode(c))}catch{}closeUnlock();render();toast('Freigeschaltet. Viel Erfolg mit deinem Verteiler!')}else{const e=$('#codeErr');e.textContent='Dieser Code ist nicht gültig. Prüfe die Schreibweise aus deiner Kauf-E-Mail.';e.hidden=false}});return}
  if(!licensed){openUnlock();return}
  if(f.id==='fEntry'){const name=$('#eName').value.trim(),amount=n($('#eAmt').value),period=$('#ePer').value,cat=$('#eCat').value,acc=$('#eAcc').value;
    if(!name||!(amount>0))return toast('Bitte Bezeichnung und Betrag eintragen.');
    owned();const e=edit&&edit.kind==='entry'&&S.entries.find(x=>x.id===edit.id);
    if(e)Object.assign(e,{name,amount,period,cat,acc});else{S.entries.push({id:uid(),name,amount,period,cat,acc});form.cat=cat;form.per=period;form.catAcc[cat]=acc;saveForm()}
    edit=null;changed();toast(e?'Gespeichert':'Zahlung hinzugefügt');$('#eName')?.focus()}
  if(f.id==='fIncome'){const name=$('#iName').value.trim(),amount=n($('#iAmt').value),period=$('#iPer').value;
    if(!name||!(amount>0))return toast('Bitte Bezeichnung und Betrag eintragen.');
    owned();const e=edit&&edit.kind==='income'&&S.income.find(x=>x.id===edit.id);
    if(e)Object.assign(e,{name,amount,period});else S.income.push({id:uid(),name,amount,period});edit=null;changed();toast('Gespeichert')}
  if(f.id==='fAcc'){const name=$('#aName').value.trim(),transfer=n($('#aAmt').value);
    if(!name||!(transfer>=0))return toast('Bitte Kontoname und Betrag eintragen.');
    owned();const a=edit&&edit.kind==='account'&&S.accounts.find(x=>x.id===edit.id);
    if(a)Object.assign(a,{name,transfer});else S.accounts.push({id:uid(),name,transfer});edit=null;changed();toast('Gespeichert')}
  if(f.id==='fCats'){owned();const c={};Object.keys(CAT).forEach(k=>{const v=$('#cn_'+k).value.trim().slice(0,40);if(v)c[k]=v});S.catNames=c;changed();toast('Kategorienamen gespeichert')}
  if(f.id==='fImport'){try{const d=JSON.parse($('#impText').value);if(!validState(d))throw 0;const cn={};if(d.catNames&&typeof d.catNames==='object')Object.keys(CAT).forEach(k=>{if(typeof d.catNames[k]==='string'&&d.catNames[k].trim())cn[k]=d.catNames[k].trim().slice(0,40)});S={v:1,demo:false,catNames:cn,income:d.income,accounts:d.accounts,entries:d.entries};fixState(S);edit=null;changed();toast('Sicherung eingelesen')}catch{toast('Das ist keine gültige Sicherung.')}}
});
render();
(()=>{
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone)return;
  let off=false;try{off=sessionStorage.getItem('fo_install_off')==='1'}catch{}
  if(off)return;
  const ua=navigator.userAgent;
  const ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const mobile=ios||/android|mobile/i.test(ua);
  const el=$('#install');let deferred=null,shown=false;
  const share='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  const tip='<p>Wichtig: Gib deinen Freischaltcode erst in der gespeicherten App ein.</p>';
  const later='<button class="btn ghost small" type="button" id="insLater">Später</button>';
  function show(html){el.innerHTML=html;el.hidden=false;shown=true;
    $('#insLater').onclick=()=>{el.hidden=true;try{sessionStorage.setItem('fo_install_off','1')}catch{}};
    const go=$('#insGo');if(go)go.onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch{}deferred=null;el.hidden=true}}
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;
    show(`<strong>Speichere den Kontoverteiler als App</strong><p>Dann startest du ihn wie jede andere App vom Startbildschirm, auch offline.</p>${tip}<div class="row2"><button class="btn small" type="button" id="insGo">Als App installieren</button>${later}</div>`)});
  addEventListener('appinstalled',()=>{el.hidden=true;toast('App gespeichert. Öffne sie jetzt vom Startbildschirm.')});
  if(ios)setTimeout(()=>show(`<strong>Speichere den Kontoverteiler als App</strong><ol><li>Tippe in Safari auf <b>Teilen</b> ${share}</li><li>Wähle <b>„Zum Home-Bildschirm“</b></li><li>Tippe auf <b>„Hinzufügen“</b></li></ol>${tip}<div class="row2">${later}</div>`),900);
  else if(mobile)setTimeout(()=>{if(!shown)show(`<strong>Speichere den Kontoverteiler als App</strong><ol><li>Öffne das Browser-Menü <b>⋮</b></li><li>Wähle <b>„App installieren“</b> oder <b>„Zum Startbildschirm hinzufügen“</b></li></ol>${tip}<div class="row2">${later}</div>`)},3000);
})();
if('serviceWorker' in navigator&&document.querySelector('link[rel="manifest"]'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body></html>
